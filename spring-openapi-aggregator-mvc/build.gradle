plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = rootProject.group
version = rootProject.version

repositories { mavenCentral() }

dependencies {
    api project(':')
    api 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':spring-openapi-aggregator-webflux')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
        mavenBom "org.springdoc:springdoc-openapi-bom:3.0.0"
    }
}
