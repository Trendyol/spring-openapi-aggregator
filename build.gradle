plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.trendyol'
version = '0.0.1'
description = 'Spring OpenAPI Aggregator'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
    withJavadocJar()
    withSourcesJar()
}

subprojects {
    plugins.withId('java') {
        java {
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = 17
        }
    }
}

repositories {
    if (project.hasProperty('centralProxyUrl')) {
        maven { url = uri(project.getProperty('centralProxyUrl')) }
    } else {
        mavenCentral()
    }
}

ext {
    set('springCloudVersion', "2025.1.2")
    set('springdocVersion', "3.0.0")
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework:spring-context'
    api 'org.jspecify:jspecify'
    api 'org.slf4j:slf4j-api'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-core'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            exclude 'com/trendyol/openapiaggregator/rest/**'
            exclude 'com/trendyol/openapiaggregator/autoconfigure/OpenApiAggregatorAutoConfiguration.java'
            exclude 'com/trendyol/openapiaggregator/service/RouteDefinitionAccessor.java'
        }
    }
    test {
        java {
            exclude 'com/trendyol/openapiaggregator/rest/**'
            exclude 'com/trendyol/openapiaggregator/service/RouteDefinitionAccessorTest.java'
        }
    }
}

test {
    useJUnitPlatform()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springdoc:springdoc-openapi-bom:${springdocVersion}"
    }
}
