openapi:
  aggregator:
    cache:
      enabled: true
      ttl: 10m
      # Optional; required only when multiple CacheManager beans are present.
      # cache-manager-name: myCacheManager
      # Optional; uses the first cache exposed by the selected CacheManager when omitted.
      # cache-name: myCache
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    use-root-path: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: Unified API
        url: /v3/api-docs/unified
